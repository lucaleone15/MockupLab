# MockupLab on Netlify — https://mockuplab3d.netlify.app
# Netlify never builds this site: `npm run deploy` (or `deploy:preview`) builds on the Mac and uploads dist/.
# So pushes to GitHub cost no Netlify credits; only a production deploy does (15 credits).

[build]
  publish = "dist"
  # no command: nothing is built on Netlify

# English addresses → the English page; every other address → the app (French landing, /studio, /rapide…).
# Real files (assets, pictures, robots.txt…) are served first.
[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files never change: cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pictures, textures and models: a week (their names do not change between versions).
[[headers]]
  for = "/showcase/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pages and the service worker: always checked, so a new version shows up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Everywhere. No Content-Security-Policy: video export and PDF import use workers, blobs and WebAssembly,
# which a strict policy would break.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
