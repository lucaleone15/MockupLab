# The old address https://mockuplab3d.netlify.app now only sends people to https://mockuplab.luca-leone.ch.
# Published once with `npm run deploy:netlify-redirect` (Netlify never builds on a push).

[build]
  publish = "scripts/netlify-redirect"
  # no command: nothing is built on Netlify

# Every address → the same address on the new site (permanent, so search engines move it too).
# Not forced: sw.js, the one real file here, is still served, so installed copies of the old app clean up.
[[redirects]]
  from = "/*"
  to = "https://mockuplab.luca-leone.ch/:splat"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
