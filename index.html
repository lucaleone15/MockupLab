<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="MockupLab — générateur de mock-ups 3D gratuit et open source, 100 % dans le navigateur." />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="MockupLab — mock-ups 3D gratuits dans le navigateur" />
    <meta property="og:description" content="Appareils 3D réalistes, print, mode photo en perspective, variantes, vidéos. Gratuit, open source, rien n'est envoyé sur un serveur." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0e" />
    <title>MockupLab</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html { background: #f5f5f7; --splash-fg: #6e6e73; }
      html[data-theme='dark'] { background: #0b0b0e; --splash-fg: #98989d; }
    </style>
    <script>
      try {
        const p = localStorage.getItem('mockuplab:theme');
        const dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- shown while the project and the 3D engine load; React replaces it -->
      <div style="height:100%;display:grid;place-items:center;font:500 13px system-ui,sans-serif;color:var(--splash-fg,#8a8a92)">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <img src="./icons/icon-192.png" width="56" height="56" alt="" />
          <span>MockupLab</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
