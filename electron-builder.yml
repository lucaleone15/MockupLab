# Desktop builds: one macOS disk image (Apple Silicon + Intel) and one Windows installer.
# The app folder is desktop/ (its own package.json: only electron-updater ships).
appId: app.mockuplab
productName: MockupLab
copyright: Copyright © 2026 Luca Leone
directories:
  app: desktop
  output: release
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - update-check.cjs
  - web/**
  - package.json
mac:
  category: public.app-category.graphics-design
  icon: public/icons/icon-1024.png
  artifactName: MockupLab-Mac.${ext}
  target:
    - target: dmg
      arch: [universal]
  # not signed yet: set to a Developer ID identity (and notarize) when an Apple account exists;
  # meanwhile the app checks GitHub itself and opens the download page (desktop/update-check.cjs)
  identity: null
dmg:
  writeUpdateInfo: false
win:
  icon: public/icons/icon-512.png
  artifactName: MockupLab-Windows.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  # one installer, no .blockmap: updates download the whole installer (small app, simpler release page)
  differentialPackage: false
publish:
  provider: github
  owner: lucaleone15
  repo: MockupLab
  releaseType: release
