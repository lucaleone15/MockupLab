name: Desktop app

# Pushing a tag like v1.0.0 builds the macOS and Windows apps and publishes
# them (with the update metadata electron-updater reads) on GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # one release first: the macOS and Windows builds then upload into it
  # (when each created it, two releases with the same tag appeared)
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "MockupLab ${GITHUB_REF_NAME#v}" --notes "**Mac** : télécharge MockupLab-Mac.dmg (Apple Silicon et Intel). Au premier lancement : clic droit › Ouvrir.
**Windows** : télécharge MockupLab-Windows.exe.
(latest.yml sert uniquement aux mises à jour automatiques de Windows.)" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run desktop:web
      - run: npx electron-builder --config electron-builder.yml --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
